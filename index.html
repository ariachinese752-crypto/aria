<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>内容需求工作台 · 亚马逊家居</title>
<!-- 本工作台为单文件���地方案：全内联，零外部依赖，数据存 localStorage -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#185FA5; --blue-l:#F0F6FC;
  --red:#B3382F; --red-l:#FDF3F2; --red-b:#EBC9C5;
  --green:#2E7D32; --green-l:#F1F8F1;
  --amber:#A9670A; --amber-l:#FDF8EF;
  --gray:#6B6B6B; --gray-l:#F5F5F5; --gray-b:#DCDCDC;
  --purple:#5B4EA8; --purple-l:#F4F3F9;
  --line:#E7E7E7;
}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:#FFFFFF;color:#1F1F1F;font-size:14px;line-height:1.6;
  padding-bottom:calc(28px + env(safe-area-inset-bottom));
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:1180px;margin:0 auto;padding:14px}
h1{font-size:17px;font-weight:500}
.card{background:#fff;border:0.5px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
button,.btn{
  font-family:inherit;font-size:14px;cursor:pointer;border:0.5px solid var(--gray-b);
  background:#fff;color:#2C2C2A;border-radius:8px;padding:8px 12px;min-height:44px;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
}
button:hover{background:var(--gray-l)}
.btn-p{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn-p:hover{background:#0F4C8A}
.btn-sm{min-height:36px;padding:5px 10px;font-size:13px}
.btn-danger{color:var(--red);border-color:var(--red-b)}
input,select,textarea{
  font-family:inherit;font-size:16px;color:#2C2C2A;background:#fff;
  border:0.5px solid var(--gray-b);border-radius:8px;padding:9px 11px;min-height:44px;width:100%;
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:-1px}
label{display:block;font-size:13px;color:var(--gray);margin-bottom:4px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:12px;color:#8A8A85;margin-top:4px;line-height:1.5}
.muted{color:var(--gray);font-size:13px}
.tag{display:inline-flex;align-items:center;font-size:12px;padding:3px 8px;border-radius:5px;white-space:nowrap}
.t-blue{background:var(--blue-l);color:var(--blue)}
.t-red{background:var(--red);color:#fff}
.t-amber{background:var(--amber-l);color:var(--amber)}
.t-green{background:var(--green-l);color:var(--green)}
.t-gray{background:var(--gray-l);color:var(--gray)}
.t-purple{background:var(--purple-l);color:var(--purple)}
.empty{text-align:center;color:var(--gray);padding:26px 12px;font-size:13px}

/* 主区页签：需求清单 / 卡点分析 */
.pane-sw{display:flex;gap:6px;margin:12px 0 10px}
.psw{flex:1;min-height:40px;font-size:13.5px;border-radius:8px;border:0.5px solid var(--gray-b);background:#fff;color:var(--gray)}
.psw.on{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:500}
/* 分析页 */
.ip-h{display:flex;align-items:baseline;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.ip-h b{font-size:15px;font-weight:600}
.ip-lead{background:#fff;border:0.5px solid var(--line);border-left:3px solid var(--red);border-radius:10px;
  padding:11px 14px;font-size:13.5px;line-height:1.75;margin-bottom:12px}
.ip-lead b{color:var(--red);font-weight:600}
.ip-lead i{font-style:normal;color:var(--green);font-weight:600}
.ip-split{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--gray-l);margin:8px 0 6px}
.ip-split i{display:block;height:100%}
.ip-lg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--gray);margin-bottom:4px}
.ip-lg span{display:flex;align-items:center;gap:5px}
.ip-dot{width:9px;height:9px;border-radius:2px;display:inline-block}
.ip-find{border:0.5px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;margin-bottom:8px;font-size:13px;line-height:1.65}
.ip-find .k{font-size:12px;color:var(--gray)}
.ip-find .k b{color:#2C2C2A;font-weight:500}
.ip-tb{width:100%;border-collapse:collapse;font-size:13px}
.ip-tb th{text-align:left;font-weight:500;color:var(--gray);font-size:12px;padding:7px 6px;border-bottom:0.5px solid var(--line);white-space:nowrap}
.ip-tb td{padding:9px 6px;border-bottom:0.5px solid var(--line);vertical-align:top}
.ip-tb tr:last-child td{border-bottom:0}
.ip-tb .num{font-variant-numeric:tabular-nums;text-align:center}
.ip-tb .nm{font-weight:500;white-space:nowrap}
.ip-tb .bad{color:var(--red);font-weight:600}
.ip-tb .warn{color:var(--amber);font-weight:600}
.ip-tb .mintxt{font-size:12px;color:var(--gray);line-height:1.5}

/* header */
header{background:#fff;border-bottom:0.5px solid var(--line);padding:12px 16px;position:sticky;top:0;z-index:20}
.hd{max-width:1180px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hd-l{display:flex;align-items:center;gap:10px;min-width:0}
.hd-acts{display:flex;gap:6px;flex-wrap:wrap}

/* layout */
.layout{display:grid;grid-template-columns:236px minmax(0,1fr);gap:14px;align-items:start;margin-top:14px}
@media(max-width:900px){.layout{grid-template-columns:1fr;gap:12px}}
.side{background:#fff;border:0.5px solid var(--line);border-radius:12px;padding:12px;position:sticky;top:74px}
@media(max-width:900px){.side{position:static}}

/* scope tabs */
.vtabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
.vtab{padding:10px 6px;font-size:13px;min-height:44px;border-radius:8px;border:0.5px solid var(--gray-b);
  background:#fff;cursor:pointer;text-align:center;line-height:1.3}
.vtab b{display:block;font-size:16px;font-weight:600}
.vtab.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.vtab.on span{color:#D6E8F7}

/* filter groups */
.fg{margin-bottom:14px}
.fg-t{font-size:12px;color:var(--gray);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.fi{display:flex;align-items:center;gap:8px;width:100%;padding:7px 8px;min-height:38px;border-radius:7px;
  border:0;background:transparent;cursor:pointer;text-align:left;font-size:13px;color:#2C2C2A}
.fi:hover{background:var(--gray-l)}
.fi.on{background:var(--blue-l);color:var(--blue);font-weight:500}
.fi-n{margin-left:auto;font-size:12px;color:var(--gray);font-variant-numeric:tabular-nums}
.fi.on .fi-n{color:var(--blue)}
.fi-bar{height:3px;border-radius:2px;background:var(--line);flex:0 0 34px;overflow:hidden}
.fi-bar i{display:block;height:100%;background:var(--blue);border-radius:2px}
.fi.on .fi-bar i{background:var(--blue)}
.fi-red .fi-bar i{background:var(--red)} .fi-red .fi-n{color:var(--red)}
.fi-amber .fi-bar i{background:var(--amber)} .fi-amber .fi-n{color:var(--amber)}
.fg-sep{height:1px;background:var(--line);margin:10px 0}
.fg-hint{font-style:normal;font-size:11px;color:var(--gray-b)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media(max-width:560px){.stats{grid-template-columns:1fr 1fr}}
.st{background:#fff;border:0.5px solid var(--line);border-radius:10px;padding:11px 12px}
.st .n{font-size:22px;font-weight:500;line-height:1.2;font-variant-numeric:tabular-nums}
.st .l{font-size:12px;color:var(--gray)}
.st.red .n{color:var(--red)} .st.amber .n{color:var(--amber)} .st.green .n{color:var(--green)}
.st.gray-s .n{color:var(--gray)}

/* 红线规则说明条 */
.rulebar{background:#fff;border:0.5px solid var(--line);border-radius:10px;padding:9px 12px;margin-top:10px;
  display:flex;gap:6px 16px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--gray)}
/* 数据缺口提示条 */
.gaptip{display:flex;align-items:flex-start;gap:8px;background:#FFF8E6;border:0.5px solid #E8D9A8;
  border-radius:10px;padding:9px 12px;margin-top:8px;font-size:12.5px;color:#6B5518;line-height:1.55}
.gaptip svg{flex-shrink:0;margin-top:1px}
.gaptip a{color:#8A5A00;text-decoration:underline;white-space:nowrap}
.rulebar b{color:var(--red);font-weight:500}
.rb-ti{font-weight:500;color:#2C2C2A}

/* 双时间锚点进度条 */
.rb{margin-top:8px;padding-top:8px;border-top:0.5px dashed var(--line)}
.rb-none{font-size:12px;color:var(--gray-b)}
.rb-d{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--gray);margin-bottom:5px}
.rb-d b{font-weight:500;color:#2C2C2A;font-variant-numeric:tabular-nums}
.rb-na{color:var(--gray-b)}
.rb-ok{font-style:normal;color:var(--green);font-size:11px}
.rb-red{display:flex;align-items:center;gap:8px;font-size:12px;padding:5px 9px;border-radius:6px;flex-wrap:wrap}
.rb-k{font-weight:500}
.rb-v{font-variant-numeric:tabular-nums;color:var(--gray)}
.rb-t{margin-left:auto;font-variant-numeric:tabular-nums}
.rb-r1{background:var(--red-l);color:var(--red)}
.rb-r2{background:var(--amber-l);color:var(--amber)}
.rb-r3{background:var(--blue-l);color:var(--blue)}
.rb-r0{background:var(--gray-l);color:var(--gray)}
.rb-red.rb-ok{background:var(--green-l);color:var(--green)}

/* today */
.today{background:var(--red-l);border:0.5px solid var(--red-b);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.today-t{font-size:14px;font-weight:500;color:var(--red);margin-bottom:8px;display:flex;align-items:center;gap:7px}
.ti{background:#fff;border-radius:8px;padding:10px 12px;margin-bottom:8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ti:last-child{margin-bottom:0}
.ti-main{flex:1;min-width:170px}
.ti-n{font-size:14px;font-weight:500;word-break:break-word;line-height:1.4}
.ti-s{font-size:12px;color:var(--gray);margin-top:2px}
.today-ok{background:var(--green-l);border:0.5px solid #C0D99A;border-radius:12px;padding:12px 14px;
  color:var(--green);font-size:13px;margin-bottom:12px}

/* list toolbar */
.tb{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tb-n{font-size:13px;color:var(--gray)}
.chip{font-size:12px;padding:5px 10px;min-height:34px;border-radius:7px;border:0.5px solid var(--gray-b);
  background:#fff;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}

/* requirement card */
.req{background:#fff;border:0.5px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:8px}
.req.od{border-color:var(--red-b);background:#FFFCFC}
.req-h{display:flex;align-items:flex-start;gap:8px}
.req-n{flex:1;min-width:0;font-size:14px;font-weight:500;word-break:break-word;line-height:1.4}
.req-m{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:center}
.req-w{font-size:12px;color:var(--gray);margin-top:5px;line-height:1.5}
.req-w b{color:var(--red);font-weight:500}
.req-a{margin-top:8px;display:flex;gap:6px}
.more{text-align:center;padding:10px}

/* modal */
.mask{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.35);z-index:50;
  padding:20px 12px;overflow-y:auto}
.mask.on{display:block}
.modal{background:#fff;border-radius:12px;padding:16px;max-width:560px;margin:0 auto}
.mt{font-size:16px;font-weight:500;margin-bottom:12px}
.mf{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.fld{margin-bottom:11px}
#toast{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:80px;background:#2C2C2A;color:#fff;
  padding:10px 18px;border-radius:8px;font-size:14px;z-index:99;max-width:90%}
.links{display:flex;flex-wrap:wrap;gap:8px}
.lk{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:8px 12px;min-height:44px;
  border-radius:8px;border:0.5px solid var(--line);background:#fff;color:#2C2C2A;text-decoration:none}
.lk:hover{background:var(--blue-l);border-color:var(--blue)}
.lk-na{opacity:.5}
/* 刷新按钮转圈反馈 */
@keyframes wbs-spin{to{transform:rotate(360deg)}}
#btnRefresh.busy svg{animation:wbs-spin .8s linear infinite}
#btnRefresh:disabled{opacity:.7;cursor:default}
/* 数据新鲜度标记 */
.ds{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:3px 9px;border-radius:20px;
  background:var(--gray-l);color:var(--gray);cursor:pointer;white-space:nowrap}
.ds.stale{background:var(--amber-l);color:var(--amber)}
.ds-old{background:var(--red-l);color:var(--red)}
/* ===== 干净白色主题 =====
   纯白底 + 中性灰细线；语义色只留在文字、细边框和数据图表上，
   不再用大块彩色背景铺满屏幕 */
.card,.st,.side,.rulebar,.req,.ti,.lk,.vtab,.chip,.psw,button.btn,button{
  background:#fff;border-color:var(--line);
}
.card,.st,.side,.rulebar,.req{box-shadow:0 1px 2px rgba(0,0,0,.035)}
/* 今日处理：白底 + 红色左边框，保留警示但不铺红 */
.today{background:#fff;border:0.5px solid var(--line);border-left:3px solid var(--red)}
.today-ok{background:#fff;border:0.5px solid var(--line);border-left:3px solid var(--green)}
.gaptip{background:#fff;border:0.5px solid var(--line);border-left:3px solid var(--amber);color:#6B5518}
.req.od{background:#fff;border-color:var(--red-b)}
/* 红线胶囊：白底细边 + 语义色文字 */
.rb-r1{background:#fff;border:0.5px solid var(--red-b)}
.rb-r2{background:#fff;border:0.5px solid #EBDCBE}
.rb-r3{background:#fff;border:0.5px solid #D8E4F2}
.rb-r0{background:#FAFAFA;border:0.5px solid var(--line)}
.rb-red.rb-ok{background:#fff;border:0.5px solid #CDE3CD}
/* 非语义标签统一中性灰，减少彩色碎块 */
.t-blue,.t-purple,.t-gray{background:#F4F4F4;color:#555}
.ds,.ds.stale,.ds-old{background:#F5F5F5}
.lk:hover{background:#F7F7F7;border-color:var(--line)}
.fi.on{background:#F0F6FC}
.ip-split{background:#F0F0F0}
/* ===== 设计停留视图 ===== */
.dsv-sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:12px}
@media(max-width:560px){.dsv-sum{grid-template-columns:1fr 1fr}}
.dsv-note{background:#fff;border:0.5px solid var(--line);border-left:3px solid var(--blue);
  border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--gray);line-height:1.7;margin-bottom:12px}
.dsv-note b{color:#1F1F1F;font-weight:500}
.dsv-bar{height:6px;border-radius:3px;background:#F0F0F0;overflow:hidden;margin-top:5px;min-width:70px}
.dsv-bar i{display:block;height:100%;background:var(--blue)}
.dsv-bar i.hot{background:var(--red)}
/* 明细表排序切换（放标题行内，不额外占一行） */
.dsv-sort{font-size:11.5px;min-height:28px;padding:3px 9px;border-radius:6px;
  border:0.5px solid var(--line);background:#fff;color:var(--gray);cursor:pointer}
.dsv-sort.on{background:var(--blue);color:#fff;border-color:var(--blue)}
</style>
</head>
<body>

<header>
  <div class="hd">
    <div class="hd-l">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#185FA5" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h18v18H3z"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
      <h1>内容需求工作台</h1>
      <span class="muted" id="hdDate"></span>
      <span class="ds" id="hdSync" onclick="syncTip()"></span>
    </div>
    <div class="hd-acts">
      <button class="btn-sm" id="btnRefresh" onclick="doRefresh()" title="重新载入最新数据快照并重算全部状态">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        刷新
      </button>
      <button class="btn-sm" onclick="exportJSON()">导出备份</button>
      <button class="btn-sm" onclick="document.getElementById('impFile').click()">导入恢复</button>
      <button class="btn-sm btn-p" onclick="openNew()">+ 新增需求</button>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="layout">

    <!-- 左侧栏 -->
    <aside class="side">
      <div class="vtabs">
        <div class="vtab on" id="vt-mine" onclick="setView('mine')"><b id="cnMine">0</b><span>我的需求</span></div>
        <div class="vtab" id="vt-dept" onclick="setView('dept')"><b id="cnDept">0</b><span>部门总览</span></div>
      </div>

      <div class="fg">
        <div class="fg-t"><span>按时间红线</span></div>
        <div id="fgRed"></div>
      </div>
      <div class="fg-sep"></div>
      <div class="fg">
        <div class="fg-t"><span>按阶段</span></div>
        <div id="fgStage"></div>
      </div>
      <div class="fg-sep"></div>
      <div class="fg">
        <div class="fg-t"><span>按负责人</span></div>
        <div id="fgOwner"></div>
      </div>
      <div class="fg-sep"></div>
      <button class="btn-sm" style="width:100%" onclick="clearSel()">清除筛选</button>
    </aside>

    <!-- 主区 -->
    <main>
      <div class="stats" id="stats"></div>
      <div class="rulebar">
        <span class="rb-ti">红线</span>
        <span>内容 · <b>出货前14天</b>完稿</span>
        <span>拍摄 · <b>出货前21天</b>寄样（样品已到不判逾期）</span>
        <span>设计 · <b>进仓前</b>出图（无进仓按上架）</span>
      </div>
      <div id="gapTip"></div>
      <div class="pane-sw">
        <button class="psw on" id="psw-list" onclick="setPane('list')">需求清单</button>
        <button class="psw" id="psw-insight" onclick="setPane('insight')">卡点分析</button>
        <button class="psw" id="psw-design" onclick="setPane('design')">延误出图</button>
      </div>

      <div id="paneList">
      <div id="todayBox"></div>

      <div class="tb">
        <span class="tb-n" id="listN"></span>
        <span style="flex:1"></span>
        <button class="chip on" id="sf-all" onclick="setStatus('all')">全部</button>
        <button class="chip" id="sf-anchor" onclick="setStatus('anchor')">仅看需处理</button>
      </div>
      <div id="list"></div>
      <div class="more"><button class="btn-sm" id="moreBtn" onclick="moreList()" style="display:none">加载更多</button></div>
      </div>

      <div id="paneInsight" style="display:none"></div>
      <div id="paneDesign" style="display:none"></div>

      <div class="card" style="margin-top:16px">
        <div style="font-size:14px;font-weight:500;margin-bottom:10px">常用入口</div>
        <div class="links" id="links"></div>
      </div>
    </main>
  </div>
</div>

<!-- 编辑/新增 -->
<div class="mask" id="maskE">
  <div class="modal">
    <div class="mt" id="eTitle">编辑需求</div>
    <div class="fld"><label>需求名称</label><input id="eName" placeholder="品牌-产品名-站点"></div>
    <div class="row">
      <div class="fld"><label>当前进度</label><select id="eProg"></select></div>
      <div class="fld"><label>负责人</label><select id="eOwner"></select></div>
    </div>
    <div class="row">
      <div class="fld"><label>期望完成时间</label><input type="date" id="eExp"></div>
      <div class="fld"><label>预计上架时间 <em class="fg-hint">有进仓时忽略</em></label><input type="date" id="eLau"></div>
    </div>
    <div class="row">
      <div class="fld"><label>需求提交时间</label><input type="date" id="eSub"></div>
      <div class="fld"><label>品类</label><input id="eCat" placeholder="如 Duvet Cover Sets"></div>
    </div>

/* 钉钉快照优先：HTML 里的 DATA_DATE 变了就说明脚本刷新过，用新 SEED 覆盖；
   但页面里手动新增/编辑过的条目（m:1）会保留，不会丢 */
function loadData(){
  var sd='', old=[];
  try{sd=localStorage.getItem(KEYS)||'';}catch(e){}
  try{var raw=localStorage.getItem(KEY);if(raw){var a=JSON.parse(raw);if(Array.isArray(a))old=a;}}catch(e){}
  var manual=old.filter(function(x){return x&&x.m===1;});
  if(!old.length||sd!==DATA_DATE){
    DATA=JSON.parse(JSON.stringify(SEED));   /* 深拷贝，避免后续改动污染 SEED */
    var kept=0,merged=0;
    manual.forEach(function(mm){
      if(!mm||!mm.n)return;
      var hit=-1;
      for(var i=0;i<DATA.length;i++){if(DATA[i].n===mm.n){hit=i;break;}}
      if(hit<0){DATA.push(mm);kept++;}                       /* 钉钉没有 → 你自己新增的，保留 */
      else if(mm.mt&&mm.mt>DATA_DATE){DATA[hit]=mm;kept++;}  /* 你改得比快照新 → 用你的 */
      else{merged++;}                                        /* 钉钉更新了 → 以钉钉为准 */
    });
    saveData();
    try{localStorage.setItem(KEYS,DATA_DATE);}catch(e){}
    if(old.length&&sd!==DATA_DATE){
      pendingToast='已同步钉钉 '+DATA_DATE.slice(0,10)+' 数据；保留你的改动 '+kept+' 条，'+merged+' 条以钉钉为准';
    }
  }else{
    DATA=old;
  }
  try{
    var rl=localStorage.getItem(KEYL);
    LINKS=rl?JSON.parse(rl):DEFAULT_LINKS.slice();
    if(!Array.isArray(LINKS))LINKS=DEFAULT_LINKS.slice();
  }catch(e){LINKS=DEFAULT_LINKS.slice();}
}

}

/* ========== 计算层 ========== */
function todayStr(){
  var d=new Date(),m=d.getMonth()+1,dd=d.getDate();
  return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(dd<10?'0':'')+dd;
}
/* 与 DATA_DATE 同格式，用于比较「你和钉钉谁更新」 */
function nowStamp(){
  var d=new Date(),p=function(x){return (x<10?'0':'')+x;};
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}
function diffD(a,b){
  if(!a||!b)return null;
  return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000);
}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

/* 给一条需求算阶段/卡点/风险 */
function enrich(r){
  var t=todayStr();
  var stage=r.s||STAGE_OF[r.p]||'内容阶段';
  /* 样品已到（开拍中 / 等返图）→ 寄样节点已完成，不参与逾期判定 */
  var sampleArrived=(stage==='拍摄阶段'&&SAMPLE_ARRIVED.indexOf(r.p)>=0);
  var b=BLOCK_OF[r.p]||{o:'未启动',at:r.p||'—',w:''};
  var own=r.w||'';
  /* 卡在部门内部时，按负责人细分（晓晓 / 诗雨 / 楠楠 / 文姐） */
  var blk=b.o, blkAt=b.at;
  if(blk==='我·自己'){
    blk=OWNER_LABEL[own]||'未分配';
    if(own&&own!=='晓晓')blkAt=b.at+'（'+own+'）';
  }
  var open=diffD(r.u,t);
  var dExp=r.e?diffD(t,r.e):null;
  var dLau=r.l?diffD(t,r.l):null;
  /* 有进仓时间时，进仓就是项目结束锚点，预计上架不再参与任何判断 */
  var dirty=!!(!r.h&&r.l&&r.u&&r.l<r.u);   /* 无进仓时才用上架兜底校验 */
  var whLate=false;                        /* 已弃用：进仓优先，不再拿上架对比 */
  var hLeft=r.h?diffD(t,r.h):null;         /* 距进仓天数，负数为已过 */
  var isPre=PRE.indexOf(stage)>=0;

  /* ---- 双时间锚点红线（视图内均为上架前阶段，全部适用） ----
     内容/拍摄看首批出货；设计看项目结束锚点：有进仓用进仓，无进仓用预计上架兜底 */
  var rc=RED_OF[stage]||RED_OF['内容阶段'];
  var redFallback=false;
  if(rc.k!=='f'&&!r.h&&r.l){rc={k:'h',off:0,name:'设计出图（上架兜底）'};redFallback=true;}
  var anchor=rc.k==='f'?(r.f||''):(r.h||r.l||'');
  var redDate='';
  if(anchor){
    var dt=new Date(anchor+'T00:00:00');
    if(rc.off)dt.setDate(dt.getDate()+rc.off);
    var pp=function(x){return (x<10?'0':'')+x;};
    redDate=dt.getFullYear()+'-'+pp(dt.getMonth()+1)+'-'+pp(dt.getDate());
  }
  var redLeft=redDate?diffD(t,redDate):null;
  if(sampleArrived){redDate='';redLeft=null;}  /* 样品已到，不再展示寄样红线日期 */
  /* 红线日期早于需求提交日 → 需求提晚了 / 排期未同步，仍按已破线处理，但说明原因 */
  var redDirty=!!(redDate&&r.u&&redDate<r.u);
  var red='RS';
  if(sampleArrived)red='RS';        /* 样品已到 → 寄样节点闭环，不判逾期 */
  else if(redLeft===null)red='R0';
  else if(redLeft<-90)red='R0';   /* 过期超 90 天：排期表大概率未同步，不按真破线处理 */
  else if(redLeft<0)red='R1';
  else if(redLeft<=7)red='R2';
  else if(redLeft<=14)red='R3';
  var redWhy='';
  if(red==='R1'&&redDirty)redWhy=rc.name+'红线 '+redDate+' 早于需求提交 '+r.u+'，已过 '+(-redLeft)+' 天（需求提晚 / 排期未同步）';
  else if(red==='R1')redWhy=rc.name+'红线 '+redDate+' 已过 '+(-redLeft)+' 天';
  else if(red==='R2')redWhy=rc.name+'红线 '+redDate+'，仅剩 '+redLeft+' 天';
  else if(red==='R3')redWhy=rc.name+'红线 '+redDate+'，还有 '+redLeft+' 天';
  else if(red==='R0'){
    if(redDirty)redWhy=rc.name+'红线('+redDate+')早于需求提交('+r.u+')，排期需核对';
    else if(redLeft!==null)redWhy=rc.name+'红线('+redDate+')已过 '+(-redLeft)+' 天，远超正常周期，排期数据需核对';
    else redWhy='缺'+(rc.k==='f'?'首批出货':'进仓（也无上架兜底）')+'时间，无法判红线';
  }

  var risk='OK',why='';
  if(sampleArrived){risk='OK';why='样品已到，寄样节点已完成';}
  else if(red==='R1'){risk='R1';why=redWhy+'；当前'+stage+'（'+b.at+'）';}
  else if(red==='R2'){risk='R2';why=redWhy+'，当前'+stage+'（'+b.at+'）';}
  else if(red==='R3'){risk='R3';why=redWhy;}
  else if(red==='R0'){risk='R0';why=redWhy;}
  else if(dirty){risk='S9';why='预计上架('+r.l+')早于需求提交('+r.u+')，排期数据需核对';}
  else if(dExp!==null&&dExp<0){risk='S2';why='超期望完成时间 '+(-dExp)+' 天，内容交付已延期';}
  else if(open!==null&&open>(STALL[stage]||30)){risk='S4';why='停滞 '+open+' 天（'+r.u+' 提交），超'+stage+'正常节奏 '+(open-(STALL[stage]||30))+' 天';}
  else if(r.p==='未开始'&&open!==null&&open>14){risk='S5';why='提交 '+open+' 天仍未启动';}
  else if(blk==='我·自己'){risk='S7';why='卡在自己手上：'+b.at;}
  else if(MEMBERS.indexOf(blk)>=0){risk='S10';why='在'+blk+'手上：'+b.at+'，需跟进';}
  else if(blk.indexOf('外部')===0){risk='S8';why='外部依赖中：'+b.at+'（'+b.w+'）';}
  /* 卡片下方红条已展示红线日期与逾期天数，这里只留卡点描述，避免同一句话出现两次 */
  var cardWhy=why;
  if(redWhy&&why.indexOf(redWhy)===0)cardWhy=why.slice(redWhy.length).replace(/^[；，,\s]+/,'');

  var urgent=(risk==='R1'||risk==='R2'||risk==='S2'||risk==='S7');
  return {r:r,stage:stage,blk:blk,owner:own,blkAt:blkAt,blkWhy:b.w,open:open,dExp:dExp,dLau:dLau,
    dirty:dirty,whLate:whLate,hLeft:hLeft,risk:risk,why:why,cardWhy:cardWhy,urgent:urgent,sampleArrived:sampleArrived,
    red:red,redName:rc.name,redDate:redDate,redLeft:redLeft,redWhy:redWhy,redDirty:redDirty,redFallback:redFallback,
    dF:(r.f?diffD(t,r.f):null),dW:(r.h?diffD(t,r.h):null)};
}
function allEnriched(){return DATA.map(enrich);}
function inScope(e){return view==='dept'?true:e.r.o===1;}
function statusOK(e){
  if(statusFilter==='anchor')return e.red!=='R0';
  if(statusFilter==='noanchor')return e.red==='R0';
  return true;
}
function selOK(e){
  if(!sel.type)return true;
  if(sel.type==='stage')return e.stage===sel.val;
  if(sel.type==='nature')return (e.r.pr||'未填')===sel.val;
  if(sel.type==='block')return e.blk===sel.val;
  if(sel.type==='risk')return e.risk===sel.val;
  if(sel.type==='red')return e.red===sel.val;
  if(sel.type==='owner')return (e.r.w||'未分配')===sel.val;
  return true;
}
function filtered(){
  return allEnriched().filter(function(e){return inScope(e)&&statusOK(e)&&selOK(e);})
    .sort(function(a,b){
      var ra=RISK_ORDER.indexOf(a.risk),rb=RISK_ORDER.indexOf(b.risk);
      if(ra!==rb)return ra-rb;
      var da=a.dExp===null?9999:a.dExp, db=b.dExp===null?9999:b.dExp;
      return da-db;
    });
}
function scopeAll(){return allEnriched().filter(inScope);}

/* 数据新鲜度：告诉用户当前看的是哪天的钉钉快照 */
function renderSyncMark(){
  var el=document.getElementById('hdSync');
  if(!el)return;
  var ds=(typeof DATA_DATE!=='undefined'?DATA_DATE:'')||'';
  if(!ds){el.textContent='数据时间未知';el.className='ds ds-old';return;}
  var age=-1;
  try{
    var t=new Date(ds.slice(0,10)+'T'+(ds.slice(11)||'00:00')+':00');
    age=Math.floor((Date.now()-t.getTime())/3600000);
  }catch(e){age=-1;}
  var day=ds.slice(5,10).replace('-','月')+'日';
  if(age<0){el.textContent='数据 '+day;el.className='ds';}
  else if(age<20){el.textContent='数据 '+day+' · 今天更新';el.className='ds';}
  else if(age<72){el.textContent='数据 '+day+' · '+age+' 小时前';el.className='ds stale';}
  else{el.textContent='数据 '+day+' · '+Math.floor(age/24)+' 天前';el.className='ds ds-old';}
  el.title='钉钉数据快照：'+ds+'。点击了解如何更新';
}
function syncTip(){
  var ds=(typeof DATA_DATE!=='undefined'?DATA_DATE:'未知');

}
function renderSidebar(){
  var list=scopeAll();
  /* 「我的需求」视角下按负责人筛选没有意义，隐藏该组 */
  var owBox=document.getElementById('fgOwner').parentNode;
  if(owBox)owBox.style.display=(view==='mine'?'none':'');
  function countGroup(keyArr,getVal){
    var m={};keyArr.forEach(function(k){m[k]=0;});
    list.forEach(function(e){var v=getVal(e);if(m[v]!==undefined)m[v]++;});
    return m;
  }
  /* items: [[key,label],...] —— key 用于筛选比对，label 用于显示 */
  function draw(elId,items,getVal,type){
    var m={};items.forEach(function(it){m[it[0]]=0;});
    list.forEach(function(e){var v=getVal(e);if(m[v]!==undefined)m[v]++;});
    var max=0;items.forEach(function(it){if(m[it[0]]>max)max=m[it[0]];});
    var h='';
    items.forEach(function(it){
      var k=it[0],lb=it[1];
      if(m[k]===0)return;
      var on=(sel.type===type&&sel.val===k)?' on':'';
      var w=max?Math.round(m[k]/max*100):0;
      h+='<button class="fi'+on+'" onclick="setSel(\''+type+'\',\''+esc(k)+'\')">'
        +'<span class="fi-bar"><i style="width:'+w+'%"></i></span>'
        +'<span>'+esc(lb)+'</span><span class="fi-n">'+m[k]+'</span></button>';
    });
    document.getElementById(elId).innerHTML=h||'<div class="muted" style="font-size:12px;padding:4px 8px">无数据</div>';
  }
  /* 时间红线：只统计未完成的，已闭环的不参与 */
  var live=list.slice();
  var redItems=[['R1','红线已破'],['R2','7天内到期'],['R3','8-14天'],['R0','缺时间锚点'],['RS','安全']];
  (function(){
    var m={};redItems.forEach(function(it){m[it[0]]=0;});
    live.forEach(function(e){if(m[e.red]!==undefined)m[e.red]++;});
    var max=0;redItems.forEach(function(it){if(m[it[0]]>max)max=m[it[0]];});
    var h='';
    redItems.forEach(function(it){
      var k=it[0],lb=it[1];
      if(m[k]===0)return;
      var on=(sel.type==='red'&&sel.val===k)?' on':'';
      var w=max?Math.round(m[k]/max*100):0;
      var cls=(k==='R1'?' fi-red':(k==='R2'?' fi-amber':''));

/* 日期平移，用于校验「寄样/返图」是否由出货时间公式推导 */
function shiftD(ds,n){
  if(!ds)return '';
  var d=new Date(ds+'T00:00:00');
  if(isNaN(d.getTime()))return '';
  d.setDate(d.getDate()+n);
  var p=function(x){return (x<10?'0':'')+x;};
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
}
/* ========== 设计阶段时间账（晓晓口径 2026-11-06） ==========
   起点 = 进仓时间（设计出图须在此前完成）；无进仓时用预计上架兜底
   终点 = 实际结束作图 = 进度改成「已完成」那天；钉钉表不记录状态变更时间，
          因此优先取「作图进度」日志里带日期的完成/返图记录，仍没有则算到今天（进行中）
   天数 = 终点 − 起点：正数 = 拖过进仓节点，负数 = 距进仓还有 N 天 / 提前完成
   口径：只统计当前视图内未完结需求，历史 57 条已完成忽略不计 */
function parseReturnDate(log,today){
  if(!log)return '';
  var y=+today.slice(0,4),mo=+today.slice(5,7);
  var re=/(\d{1,2})[.\-\/](\d{1,2})\s*[-—]?\s*/g,m,last=null,parts=[];
  while((m=re.exec(log))){
    if(last)parts.push({mm:last.mm,dd:last.dd,txt:log.slice(last.end,m.index)});
    last={mm:+m[1],dd:+m[2],end:re.lastIndex};
  }
  if(last)parts.push({mm:last.mm,dd:last.dd,txt:log.slice(last.end)});
  var found='';
  parts.forEach(function(p){
    if(p.mm<1||p.mm>12||p.dd<1||p.dd>31)return;
    var t=p.txt||'';
    if(!/已返图|返图完成|已出图|图已返|已返首版|已完成|作图完成|已交付|已完稿/.test(t))return;
    if(/预计|希望|待返|明天返|预计明天/.test(t))return;   /* 「预计明天返图」不算实际完成 */
    var yy=p.mm>mo+1?y-1:y;
    var ds=yy+'-'+(p.mm<10?'0':'')+p.mm+'-'+(p.dd<10?'0':'')+p.dd;
    if(!found||ds>found)found=ds;
  });
  return found;
}

/* ========== 延误出图核算（固定范围：副本视图 29K13XF 全部需求） ==========
   基准 = 进仓时间；实际出图 = 设计返图时间。
   延误天数 = 实际出图 − 基准（正数为延误）；出图时间为空的不纳入计算。 */
/* delay=按延误天数降序（默认） / wh=按进仓时间从旧到新 */
var designSort='delay';
function setDesignSort(v){designSort=v;refreshAll();}
function renderDesign(){
  var box=document.getElementById('paneDesign');
  if(!box)return;
  var t=todayStr();
  var src=(typeof DESIGN_SEED!=='undefined'&&DESIGN_SEED.length?DESIGN_SEED:[]);
  if(!src.length){box.innerHTML='<div class="card empty">副本视图数据未注入，请运行一次刷新</div>';return;}
  var rows=src.map(function(r){
    /* 基准 = 进仓时间；无进仓用预计上架兜底 */
    var start=r.h||r.l||'',fb=!r.h&&!!r.l;
    /* 实际出图 = 钉钉「设计返图时间」；没填回退作图进度日志 */
    var finField=r.fin||'';
    var finLog=parseReturnDate(r.log||'',t);
    var fin=finField||finLog;
    var finSrc=finField?'钉钉字段':(finLog?'日志解析':'');
    var delay=null,status='',stCls='';
    if(!fin){
      /* 出图时间为空 → 不纳入核算，不按今天滚动计延误 */
      status='未出图·不纳入计算';
    }else if(start){
      delay=diffD(start,fin);
      if(delay>0){status='已延误';stCls='bad';}
      else{status=delay<0?'提前出图':'按期出图';stCls='ok';}
    }else{status='无时间锚点';}
    /* 共享盘更新 → 进仓 的天数；任一为空则不计算（忽略空值） */
    var shareGap=(r.sh&&start)?diffD(r.sh,start):null;
    return {r:r,start:start,fb:fb,fin:fin,finSrc:finSrc,delay:delay,status:status,stCls:stCls,
      sh:r.sh||'',shareGap:shareGap};
  });
  if(designSort==='wh'){
    /* 进仓时间从旧到新；无锚点排最后 */
    rows.sort(function(a,b){
      var av=a.start||'9999-12-31',bv=b.start||'9999-12-31';
      return av<bv?-1:(av>bv?1:0);
    });
  }else{
    rows.sort(function(a,b){return (b.delay===null?-999:b.delay)-(a.delay===null?-999:a.delay);});
  }
  /* 只核算有出图时间的记录；空值一律排除 */
  var calc=rows.filter(function(x){return x.delay!==null;});
  var late=calc.filter(function(x){return x.delay>0;});
  var avg=late.length?Math.round(late.reduce(function(s,x){return s+x.delay;},0)/late.length):0;
  var max=late.length?Math.max.apply(null,late.map(function(x){return x.delay;})):0;
  var noFin=rows.length-calc.length;
  function dsSt(n,l,c){return '<div class="st '+(c||'')+'"><div class="n">'+n+'</div><div class="l">'+l+'</div></div>';}
  var h='<div class="ip-h"><b>延误出图时间核算</b><span class="muted">数据源：新品&amp;新增变体时间节点视图 (副本)'
    +' · 全部 '+src.length+' 条 · 判定日 '+t+'</span></div>';
  h+='<div class="dsv-sum">'
    +dsSt(calc.length,'纳入核算','')
    +dsSt(late.length,'延误条数','red')
    +dsSt(avg+' 天','平均延误','red')
    +dsSt(max+' 天','最长延误','red')
    +'</div>';
  h+='<div class="dsv-note">口径：<b>延误出图时间 = 设计返图时间 − 进仓时间</b>（无进仓用预计上架兜底），'
    +'正数即延误天数，负数/0 为提前或按期出图。'
    +'<b>出图时间为空的 '+noFin+' 条不纳入计算</b>（不按今天滚动估算、不进平均值），仅在下方明细里列出供查看。'
    +'本次纳入 '+calc.length+' 条：延误 '+late.length+' 条、提前/按期 '+(calc.length-late.length)+' 条。'
    +'出图日优先读钉钉「<b>设计返图时间</b>」字段（由内容需求对接群最早返图消息回填），没填才回退作图进度日志。'
    +'新增列「共享盘更新→进仓」= 进仓时间 − 共享盘路径更新时间，<b>任一为空即留空不计算</b>。'
    +'本页覆盖副本视图全部需求，主工作台的需求清单 / 卡点分析不受影响。</div>';
  h+='<div class="card"><div class="ip-h"><b>逐条延误核算</b>'
    +'<span class="muted">数据 '+esc((typeof DATA_DATE!=='undefined'?DATA_DATE:'').slice(0,10))+'</span>'
    +'<span style="flex:1"></span>'
    +'<button class="dsv-sort'+(designSort==='delay'?' on':'')+'" onclick="setDesignSort(\'delay\')">延误天数降序</button>'
    +'<button class="dsv-sort'+(designSort==='wh'?' on':'')+'" onclick="setDesignSort(\'wh\')">进仓时间 旧→新</button>'
    +'</div>'
    +'<table class="ip-tb"><thead><tr><th>需求</th>'
    +'<th>进仓（基准）</th><th>实际出图</th><th class="num">延误天数</th><th class="num">共享盘更新→进仓</th>'
    +'</tr></thead><tbody>';
  rows.forEach(function(x){
    var r=x.r;
    var dtxt=x.delay===null?'—':(x.delay>0?'+'+x.delay+' 天':(x.delay<0?'提前 '+(-x.delay)+' 天':'0 天'));
    var shtxt=x.shareGap===null?'—':x.shareGap+' 天';
    h+='<tr><td class="nm" style="white-space:normal">'+esc(r.n)+'</td>'
      +'<td class="mintxt" style="white-space:nowrap">'+(x.start?esc(x.start)+(x.fb?'<div style="font-size:11px;opacity:.72">上架兜底</div>':''):'<span class="rb-na">未填</span>')+'</td>'
      +'<td class="mintxt" style="white-space:nowrap">'+(x.fin?esc(x.fin):'<span class="rb-na">未出图</span>')+'</td>'
      +'<td class="num '+(x.delay>0?'bad':'')+'">'+dtxt
        +(x.delay>0?'<div class="dsv-bar"><i class="hot" style="width:'
          +Math.min(100,Math.round(x.delay/Math.max(max,1)*100))+'%"></i></div>':'')
      +'</td>'
      +'<td class="num">'+shtxt
        +(x.sh?'<div style="font-size:11px;color:var(--gray);font-weight:400">'+esc(x.sh)+'</div>':'')
      +'</td></tr>';
  });
  h+='</tbody></table></div>';
  box.innerHTML=h;
}
function setPane(p){
  pane=p;
  document.getElementById('paneList').style.display=(p==='list'?'':'none');
  document.getElementById('paneInsight').style.display=(p==='insight'?'':'none');
  document.getElementById('paneDesign').style.display=(p==='design'?'':'none');
  document.getElementById('psw-list').className='psw'+(p==='list'?' on':'');
  document.getElementById('psw-insight').className='psw'+(p==='insight'?' on':'');
  document.getElementById('psw-design').className='psw'+(p==='design'?' on':'');
  if(p==='insight')renderInsight();
  if(p==='design')renderDesign();
}
function refreshAll(){
  renderHeader();
  renderSidebar();
  renderStats();
  renderToday();
  renderList();
  renderLinks();
  if(pane==='insight')renderInsight();
  if(pane==='design')renderDesign();
}

/* ========== 事件 ========== */
function setView(v){view=v;limit=40;refreshAll();}
function setStatus(s){
  statusFilter=s;
  ['all','anchor'].forEach(function(k){
    document.getElementById('sf-'+k).className='chip'+(statusFilter===k?' on':'');
  });
  limit=40;refreshAll();
}
function setSel(type,val){
  if(sel.type===type&&sel.val===val){sel={type:null,val:null};}
  else sel={type:type,val:val};
  limit=40;refreshAll();
}
function clearSel(){sel={type:null,val:null};limit=40;refreshAll();}
function moreList(){limit+=60;renderList();}

function openNew(){
  editId=null;
  document.getElementById('eTitle').textContent='新增需求';
  document.getElementById('eName').value='';
  fillProg('');
  fillOwner('晓晓');
  document.getElementById('eExp').value='';
  document.getElementById('eLau').value='';
  document.getElementById('eSub').value=todayStr();
  document.getElementById('eCat').value='';
  document.getElementById('eNote').value='';
  document.getElementById('eFsh').value='';
  document.getElementById('eWh').value='';
  document.getElementById('eAsh').value='';
  document.getElementById('maskE').className='mask on';
}
function openEdit(id){
  var r=null;
  for(var i=0;i<DATA.length;i++){if(DATA[i].id===id){r=DATA[i];break;}}
  if(!r){toast('未找到该需求');return;}
  editId=id;
  document.getElementById('eTitle').textContent='编辑需求';
  document.getElementById('eName').value=r.n||'';
  fillProg(r.p||'');
  fillOwner(r.w||'');
  document.getElementById('eExp').value=r.e||'';
  document.getElementById('eLau').value=r.l||'';
  document.getElementById('eSub').value=r.u||'';
  document.getElementById('eCat').value=r.c||'';
  document.getElementById('eNote').value=r.note||'';
  document.getElementById('eFsh').value=r.f||'';
  document.getElementById('eWh').value=r.h||'';
  document.getElementById('eAsh').value=r.a||'';
  document.getElementById('maskE').className='mask on';
}
function fillProg(cur){
  var h='<option value="">（未填）</option>';
  PROGRESS.forEach(function(p){h+='<option'+(p===cur?' selected':'')+'>'+p+'</option>';});
  document.getElementById('eProg').innerHTML=h;
}
function fillOwner(cur){
  var h='';
  MEMBERS.forEach(function(m){h+='<option'+(m===cur?' selected':'')+'>'+m+'</option>';});
  h+='<option'+((!cur||MEMBERS.indexOf(cur)<0)?' selected':'')+'>未分配</option>';
  document.getElementById('eOwner').innerHTML=h;
}
function closeE(){document.getElementById('maskE').className='mask';editId=null;}
function saveEdit(){
  var name=document.getElementById('eName').value.trim();
  if(!name){toast('请填需求名称');return;}
  var p=document.getElementById('eProg').value;
  var w=document.getElementById('eOwner').value;
  var o={
    n:name,p:p,s:STAGE_OF[p]||'内容阶段',
    e:document.getElementById('eExp').value,
    l:document.getElementById('eLau').value,
    u:document.getElementById('eSub').value,
    f:document.getElementById('eFsh').value,
    h:document.getElementById('eWh').value,
    a:document.getElementById('eAsh').value,
    c:document.getElementById('eCat').value.trim(),
    w:(w==='未分配'?'':w),
    o:w==='晓晓'?1:0,
    m:1,mt:nowStamp(),
    note:document.getElementById('eNote').value.trim()
  };
  if(editId){
    for(var i=0;i<DATA.length;i++){
      if(DATA[i].id===editId){
        o.id=editId;
        /* 保留钉钉侧字段，编辑不覆盖 */
        o.pr=DATA[i].pr||'';o.sd=DATA[i].sd||'';o.bk=DATA[i].bk||'';o.c=DATA[i].c||'';o.q=DATA[i].q||'';
        o.rt=DATA[i].rt||'';o.ps=DATA[i].ps||'';o.log=DATA[i].log||'';   /* 设计停留视图用的钉钉字段 */
        DATA[i]=o;break;
      }
    }
  }else{
    o.id='r'+Date.now();DATA.unshift(o);
  }
  saveData();closeE();refreshAll();toast('已保存');
}
function delReq(){
  if(!editId){closeE();return;}
  if(!confirm('确定删除这条需求？'))return;
  DATA=DATA.filter(function(x){return x.id!==editId;});
  saveData();closeE();refreshAll();toast('已删除');
}

function exportJSON(){
  var blob=new Blob([JSON.stringify(DATA,null,1)],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='内容需求备份-'+todayStr()+'.json';
  a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);},800);
  toast('已导出 '+DATA.length+' 条');
}
document.getElementById('impFile').addEventListener('change',function(ev){
  var f=ev.target.files&&ev.target.files[0];if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var a=JSON.parse(rd.result);
      if(!Array.isArray(a))throw new Error('格式不对');
      if(!confirm('导入 '+a.length+' 条数据，将覆盖当前列表。继续？'))return;
      DATA=a.map(function(x,i){
        return {id:x.id||('i'+i+Date.now()),n:x.n||'',p:x.p||'',s:x.s||STAGE_OF[x.p]||'内容阶段',
          e:x.e||'',l:x.l||'',u:x.u||'',f:x.f||'',h:x.h||'',a:x.a||'',c:x.c||'',w:x.w||'',o:(x.w==='晓晓'||(x.o&&!x.w))?1:0,
          pr:x.pr||'',sd:x.sd||'',bk:x.bk||'',q:x.q||'',rt:x.rt||'',ps:x.ps||'',log:x.log||'',m:1,note:x.note||''};
      });
      saveData();refreshAll();toast('已导入 '+DATA.length+' 条');
    }catch(e){toast('导入失败：'+e.message);}
    ev.target.value='';
  };
  rd.readAsText(f);
});

var toastT=null;
function toast(m){
  var el=document.getElementById('toast');
  el.textContent=m;el.style.display='block';
  clearTimeout(toastT);
  toastT=setTimeout(function(){el.style.display='none';},2200);
}

/* ========== 一键刷新 ========== */
/* 本地 HTML 无法直连钉钉；重载会读取磁盘上由刷新脚本注入的最新 SEED，
   并用当天日期重算全部红线 / 统计 / 今日必办。
   视角、页签、筛选临时存 sessionStorage，重载后还原，不打断当前工作流。 */
function doRefresh(){
  var btn=document.getElementById('btnRefresh');
  if(btn){btn.disabled=true;btn.className='btn-sm busy';}
  var st={view:view,pane:pane,status:statusFilter,sel:sel,designSort:designSort,fromRefresh:true};
  try{sessionStorage.setItem('wb_amzreq_ui',JSON.stringify(st));}catch(e){}
  toast('正在读取最新数据快照…');
  setTimeout(function(){location.reload();},350);
}
function restoreUI(){
  var u=null;
  try{u=JSON.parse(sessionStorage.getItem('wb_amzreq_ui')||'null');}catch(e){}
  if(!u)return false;
  try{sessionStorage.removeItem('wb_amzreq_ui');}catch(e){}
  if(u.view==='mine'||u.view==='dept')view=u.view;
  if(u.pane==='list'||u.pane==='insight'||u.pane==='design')pane=u.pane;
  if(u.status==='all'||u.status==='anchor')statusFilter=u.status;
  if(u.sel&&u.sel.type)sel={type:u.sel.type,val:u.sel.val};
  if(u.designSort==='delay'||u.designSort==='wh')designSort=u.designSort;
  syncUIButtons();
  return !!u.fromRefresh;
}
function syncUIButtons(){
  ['all','anchor'].forEach(function(k){
    var b=document.getElementById('sf-'+k);if(b)b.className='chip'+(statusFilter===k?' on':'');
  });
  ['list','insight','design'].forEach(function(k){
    var b=document.getElementById('psw-'+k);if(b)b.className='psw'+(pane===k?' on':'');
  });
  ['list','insight','design'].forEach(function(k){
    var el=document.getElementById('pane'+k.charAt(0).toUpperCase()+k.slice(1));
    if(el)el.style.display=(pane===k?'':'none');
  });
}

/* ========== 初始化 ========== */
document.addEventListener('DOMContentLoaded',function(){
  var wasRefresh=restoreUI();
  loadData();
  var needId=false;
  DATA.forEach(function(r){if(!r.id){r.id='r'+Math.random().toString(36).slice(2,9);needId=true;}});
  if(needId)saveData();
  refreshAll();
  if(pendingToast){var t=pendingToast;pendingToast='';setTimeout(function(){toast(t);},700);}
  else if(wasRefresh){
    var ds=(typeof DATA_DATE!=='undefined'?DATA_DATE:'');
    setTimeout(function(){toast('已刷新 · 当前数据快照 '+ds);},300);
  }
});
</script>
